name: Validate

on:
  # Run on all pushes and pull requests.
  push:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Permissions should be configured at the job level.
permissions: {}

jobs:
  validate:
    permissions:
      contents: read # To clone the repo.

    name: Validate
    uses: ./.github/workflows/reusable-validate.yml
